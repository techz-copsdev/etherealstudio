<?xml version="1.0" encoding="UTF-8"?>
<!--
  REPLACE-ME: ganti file ini dengan logo final Optik B Risky.
  - Disarankan SVG width=220 height=56 (atau atur viewBox)
  - Atau ganti pakai PNG: rename ke logo-full.png dan update tag <img> di HTML
  Lokasi: assets/brand/logo-full.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" role="img" aria-label="Optik B Risky">
  <!-- mark -->
  <g>
    <!-- frame kacamata: dua lensa + bridge, hand-drawn-ish weight -->
    <path d="M5 30 q0 -10 10 -10 h12 q10 0 10 10 q0 10 -10 10 h-12 q-10 0 -10 -10 z"
          fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M44 30 q0 -10 10 -10 h12 q10 0 10 10 q0 10 -10 10 h-12 q-10 0 -10 -10 z"
          fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M37 30 h7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <!-- temple tips kanan kiri -->
    <path d="M5 30 l-4 -3" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M76 30 l4 -3" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <!-- accent dot di kanan atas frame kanan (pemanis) -->
    <circle cx="63" cy="22" r="1.6" fill="var(--primary, #EF5A2D)"/>
  </g>

  <!-- wordmark -->
  <g font-family="Poppins, Inter, sans-serif">
    <text x="92" y="26" font-size="16" font-weight="700" fill="currentColor" letter-spacing="0.2">B Risky</text>
    <text x="92" y="42" font-size="8" font-weight="500" fill="currentColor" opacity="0.6" letter-spacing="2.4">OPTIK · KRIAN</text>
  </g>
</svg>
