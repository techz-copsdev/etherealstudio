<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-aero-03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFBFD"/>
      <stop offset="1" stop-color="#EAEDF2"/>
    </linearGradient>
    <radialGradient id="lens-aero-03" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.15"/>
    </radialGradient>
    <filter id="shadow-aero-03" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feFlood flood-color="#1D2A39" flood-opacity="0.18"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg-aero-03)"/>
  <text x="40" y="40" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#1D2A39" opacity="0.35">PLACEHOLDER · REPLACE-ME</text>
  <text x="40" y="380" font-family="Poppins, sans-serif" font-size="14" font-weight="600" fill="#1D2A39" opacity="0.7">Aero N° 03 · AVIATOR</text>

  <g filter="url(#shadow-aero-03)">
    <!-- temple kiri -->
    <path d="M170 195 q-50 -10 -100 -2" fill="none" stroke="#3A2B14" stroke-width="6" stroke-linecap="round"/>
    <!-- temple kanan -->
    <path d="M630 195 q50 -10 100 -2" fill="none" stroke="#3A2B14" stroke-width="6" stroke-linecap="round"/>
    <!-- frame kiri -->
